<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<div class="main-Container">
    <h1 class="mainHeading" >Weather WebApp</h1>
    <p class="api-text" >
        Based on Api
    </p>
    <div class="inputSection">
         <input type="search" placeholder="Type your City" id="inputtag">
         <button id="checkbtn">check</button>
    </div>
 
  <div class="second-section">
     <div class="Weather-detials">
            <h2>Dubai,AE</h2>
            <p class="temprature"> 14 °C</p> 
            </div>
            <div class="otherDetails" >
            <div class="wind">
                <p>Wind</p>
                <p class="details">3.6m/s</p>
            </div>
             <div class="wind">
                <p>pressure</p>
                <p class="details">1020hPa</p>
            </div>
             <div class="wind">
                <p>Humidity</p>
                <p class="details">48%</p>
            </div>
            </div>
  </div>
  <button class="currentLocation" id="checkbtn">Current Location </button>
  
</div>

    <script src="app.js"></script>
